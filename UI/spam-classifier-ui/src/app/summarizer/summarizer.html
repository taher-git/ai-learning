<div class="container mat-elevation-z4" style="max-width:600px;margin:auto;padding:32px;">
    <h2 mat-typography class="mat-headline-4" style="margin-bottom:24px;">Meeting Summarizer</h2>

    <mat-card>
        <mat-card-content>
            <label style="display:block;margin-bottom:8px;">Summary Style:</label>
            <mat-radio-group [value]="summaryType()" (change)="summaryType.set($event.value)" style="display:flex;flex-direction:row;gap:16px;">
                <mat-radio-button value="paragraph">Paragraph</mat-radio-button>
                <mat-radio-button value="bullet">Bullet Points</mat-radio-button>
            </mat-radio-group>
            <label style="display:block;margin-bottom:8px;">Upload Meeting File</label>
            <input type="file" (change)="onFileSelected($event, 'local')" style="width:100%;margin-bottom:16px;" />
            <button mat-raised-button color="primary" style="margin-top:16px;" (click)="onFileSelected($event, 'api')">
                Upload via API
            </button>
        </mat-card-content>
    </mat-card>

    <div *ngIf="loading()" style="margin-top:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        <div style="margin-top:8px;text-align:center;">⏳ Processing...</div>
    </div>

    <mat-card *ngIf="transcript()" style="margin-top:24px;">
        <mat-card-title>Transcript</mat-card-title>
        <mat-card-content>
            <ng-container *ngIf="!showFullTranscript()">
                <p>
                    {{ transcript().split(' ').slice(0,25).join(' ') }}{{ transcript().split(' ').length > 25 ? '...' : '' }}
                </p>
                <button mat-button color="primary" (click)="showFullTranscript.set(true)" >
                    View More
                </button>
            </ng-container>
            <ng-container *ngIf="showFullTranscript()">
                <p>
                    {{ transcript() }}
                </p>
                <button mat-button color="primary" (click)="showFullTranscript.set(false)">
                    View Less
                </button>
            </ng-container>
        </mat-card-content>
    </mat-card>

    <mat-card *ngIf="summary()" style="margin-top:24px;">
        <mat-card-title>Summary</mat-card-title>
        
        <mat-card-content *ngIf="summaryType() === 'paragraph'">
            <p>{{ summary() }}</p>
        </mat-card-content>
        <mat-card-content *ngIf="summaryType() === 'bullet'">
            <mat-list>
                <mat-list-item *ngFor="let point of summary().split('\n')">
                    {{ point }}
                </mat-list-item>
            </mat-list>
        </mat-card-content>
    </mat-card>

    <mat-card *ngIf="actionItem()" style="margin-top:24px;">
        <mat-card-title>Action Items</mat-card-title>
        <mat-card-content>
            <mat-list>
                <mat-list-item *ngFor="let item of actionItem().split('\n')">
                    {{ item }}
                </mat-list-item>
            </mat-list>
        </mat-card-content>
    </mat-card>
</div>
