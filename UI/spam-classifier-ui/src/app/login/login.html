<h2 style="text-align:center; margin-bottom: 24px;">Login</h2>
<form (ngSubmit)="onLogin()" style="max-width: 400px; margin: 0 auto;">
  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="fill" style="width:100%; margin-bottom:16px;">
        <mat-label>Username</mat-label>
        <input matInput type="text" [(ngModel)]="username" name="username" required>
      </mat-form-field>
      <mat-form-field appearance="fill" style="width:100%; margin-bottom:24px;">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" style="width:100%;">Login</button>
    </mat-card-content>
    <mat-card-actions *ngIf="errorMessage()" style="margin-top: 16px; color: red; text-align: center;">
      {{ errorMessage() }}
    </mat-card-actions>
  </mat-card>
</form>
