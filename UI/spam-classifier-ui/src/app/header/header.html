<!-- use material style to make page look pretty  -->
 
<mat-toolbar color="primary" class="mat-elevation-z4" style="padding: 0 24px;">
    <span style="font-weight: bold; font-size: 1.3rem; letter-spacing: 1px;">Spam Classifier / Meeting Summarizer</span>
    <span class="spacer" style="flex: 1 1 auto;"></span>
    <a mat-button routerLink="/home">
        <mat-icon >home</mat-icon>
        <span>Home</span>
    </a>
    <a mat-button routerLink="/home/spam-check" >
        <mat-icon>search</mat-icon>
        <span>Spam Check</span>
    </a>
    <a mat-button routerLink="/home/summarize-meeting" >
        <mat-icon>summarize</mat-icon>
        <span>Summarize Meeting</span>
    </a>
    <a mat-button routerLink="/home/code-review" >
        <mat-icon>code</mat-icon>
        <span>Code Review</span>
    </a>
    <button mat-raised-button color="accent" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
    </button>
     <!-- <mat-slide-toggle (change)="toggleTheme()" [checked]="isDarkMode" color="accent"></mat-slide-toggle> -->
     <button mat-icon-button (click)="toggleTheme()">
    <mat-icon>{{ isDarkMode ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </button>   
</mat-toolbar>
