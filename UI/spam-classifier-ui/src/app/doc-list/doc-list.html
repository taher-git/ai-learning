<!-- Modify code using mateerial table and latest design -->
 <mat-card>
  <mat-card-header>
    <mat-card-title style="padding-bottom: 16px;">Document List</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <!-- Material Table with Angular Material components -->
         @if(docs().length == 0){
           <span>
            No documents uploaded yet.
           </span> 
         } @else {
        <table mat-table [dataSource]="docs()" class="mat-elevation-z8">
            <!-- Name Column -->
            <ng-container matColumnDef="filename">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let d">{{ d.filename }}</td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let d">
                    <!-- <button mat-raised-button color="primary" (click)="view(r)">View</button> -->
                    <button mat-raised-button color="primary" (click)="delete(d.filename)">Delete</button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['filename', 'actions']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['filename', 'actions'];"></tr>
        </table>
    }
    </mat-card-content>
