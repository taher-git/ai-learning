<div class="container mat-elevation-z4" style="max-width:600px;margin:auto;padding:32px;">
  <mat-card>
    <mat-card-header>
      <mat-card-title class="text-center">Document Assistant</mat-card-title>
           <a mat-button (click)="showHistory.set(!showHistory())" style="position:absolute;top:16px;right:16px;">
                <span>{{ showHistory() ? 'Back' : 'Documents'}}</span>
            </a>
            @if(!showHistory()){
            <a mat-button (click)="clearChatHistory()" style="position:absolute;top:110px;right:16px;">
                <span>{{ 'Clear Chat'}}</span>
            </a>
          }
    </mat-card-header>
    <mat-card-content>
        <mat-label style="display:block;margin-bottom:8px;">Upload Document</mat-label>
        <!-- Add a radio button -->
         @if(showHistory()){
            <app-doc-list></app-doc-list>
         } @else {
        <div class="text-center my-4" style="margin-top: 50px;">
              <!-- <mat-radio-group [value]="byCategoryFlag()" (change)="changeByCategoryFlag($event.value)" style="display:flex;flex-direction:row;gap:16px;justify-content:left;margin-bottom:16px;">
                <mat-radio-button value="true">Review by Category</mat-radio-button>
                <mat-radio-button value="false">Full Review</mat-radio-button>
              </mat-radio-group> -->
              <input type="file" accept=".pdf,.xls,.txt,.xlsx" (change)="onFileSelected($event)" multiple style="width:100%;margin-bottom:16px;" />
        </div>
        <div *ngIf="loading()" style="margin-top:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
          <div style="margin-top:8px;text-align:center;">⏳ Embedding...</div>
        </div>
        <div *ngIf="(uploadStatus().status == 'success' || docs().length > 0) && !loading()" class="mt-4">
          <mat-card>
            <mat-card-title>Results for {{uploadStatus().status}}</mat-card-title>
                <app-chat mode = "api" from = "document"> </app-chat>
          </mat-card>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
